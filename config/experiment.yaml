# Hierarchical action-sequence experiment defaults

model:
  family: "qwen3"
  size: "4b"
  dtype: "auto"
  tensor_parallel_size: 1

experiment:
  num_participants: 40
  n_trials: 80
  n_agents: 4
  transfer_rule_type: "transfer_low"  # Options: transfer_low, transfer_high
  notify_transfer: false  # If true, explicitly notify agent when transfer phase begins

output:
  dir: "results"
  save_json: true
